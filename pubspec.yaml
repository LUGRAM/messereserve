name: messeconnect
description: "Application de gestion de messes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  #flutter_riverpod: ^3.0.3
  #go_router: ^17.0.0
  flutter_svg: ^2.2.3
  #shared_preferences: ^2.5.3
  lottie: ^3.3.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.12.0

  intl_phone_field: ^3.2.0
  intl: ^0.19.0
  dio: ^5.4.0
  get: ^4.6.6
  get_storage: ^2.1.1
  image_picker: ^1.0.7
  http: ^1.2.0
  flutter_html: ^3.0.0

  # Pour utiliser des fonts custom (ex: Poppins)
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/masses/
    - assets/lottie/
    - assets/fonts/
