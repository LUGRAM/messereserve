name: messeconnect
description: "Application de gestion de messes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.12.0
  http: ^1.6.0



  # Pour utiliser des fonts custom (ex: Poppins)
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/masses/
    - assets/lottie/
